<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    /* Prevents iOS Safari from auto-zooming into inputs when tapped */
    input[type="text"] {
      font-size: 16px; 
      padding: 4px;
      margin: 3px 0;
      box-sizing: border-box;
    }
    /* Touch-friendly buttons for active testing environments */
    button {
      padding: 12px 18px;
      font-size: 16px;
      border-radius: 6px;
      border: 1px solid #bbb;
      cursor: pointer;
      margin-right: 8px;
    }
    #clearBtn {
      background-color: #f8d7da;
      color: #721c24;
      border-color: #f5c6cb;
    }
  </style>
</head>

<h2>Reading Compiler</h2>
<form id="readingForm">

  Pole <input type="text" inputmode="text" autocapitalize="characters" id="pole" style="width: 60px">
  Fixture <input type="text" inputmode="decimal" id="fixture" style="width: 60px">
  <br>
  <br>
  RrBb = <input type="text" inputmode="numeric" id="ohm_rrbb" style="width: 60px"> M&Omega;
  <input type="text" inputmode="numeric" id="volt_rrbb" style="width: 60px"> V
  <br>
  RbBr = <input type="text" inputmode="numeric" id="ohm_rbbr" style="width: 60px"> M&Omega;
  <input type="text" inputmode="numeric" id="volt_rbbr" style="width: 60px"> V
  <br>
  RrBg = <input type="text" inputmode="numeric" id="ohm_rrbg" style="width: 60px"> M&Omega;
  <input type="text" inputmode="numeric" id="volt_rrbg" style="width: 60px"> V
  <br>
  RbBg = <input type="text" inputmode="numeric" id="ohm_rbbg" style="width: 60px"> M&Omega;
  <input type="text" inputmode="numeric" id="volt_rbbg" style="width: 60px"> V
  <br>
  RgBr = <input type="text" inputmode="numeric" id="ohm_rgbr" style="width: 60px"> M&Omega;
  <input type="text" inputmode="numeric" id="volt_rgbr" style="width: 60px"> V
  <br>
  RgBb = <input type="text" inputmode="numeric" id="ohm_rgbb" style="width: 60px"> M&Omega;
  <input type="text" inputmode="numeric" id="volt_rgbb" style="width: 60px"> V
  <br>
  <br>
  Input <input type="text" inputmode="numeric" id="vac" style="width: 60px"> VAC
  <br>
  Output <input type="text" inputmode="numeric" id="vdc" style="width: 60px"> VDC
  <br>
  <br>
  
  <!-- Form Control Actions -->
  <button type="button" id="copyBtn" onclick="copySummary()">Copy Summary</button>
  <button type="button" id="clearBtn" onclick="resetForm()">Clear Data</button>

  <p>Summary:<br><br> <output id="result"></output></p>
</form>

<script>
// Sequential array of fields to govern 'Next' button cursor travel
const inputOrder = [
  'pole', 'fixture',
  'ohm_rrbb', 'volt_rrbb',
  'ohm_rbbr', 'volt_rbbr',
  'ohm_rrbg', 'volt_rrbg',
  'ohm_rbbg', 'volt_rbbg',
  'ohm_rgbr', 'volt_rgbr',
  'ohm_rgbb', 'volt_rgbb',
  'vac', 'vdc'
];

// Handle keyboard "Enter" or "Next" presses on iOS keypad
document.getElementById('readingForm').addEventListener('keydown', function(event) {
  if (event.key === 'Enter') {
    event.preventDefault(); // Prevents default browser submission behavior
    
    const currentId = event.target.id;
    const currentIndex = inputOrder.indexOf(currentId);
    
    if (currentIndex !== -1 && currentIndex < inputOrder.length - 1) {
      // Focus the next sequential input field down
      document.getElementById(inputOrder[currentIndex + 1]).focus();
    } else if (currentId === 'vdc') {
      // If pressing Next on the very last field, execute copy action immediately
      copySummary();
    }
  }
});

// Helper function to build the text string dynamically and skip blank test rows
function generateSummary(isHtml = true) {
  const getValue = (id) => document.getElementById(id).value.trim();
  const br = isHtml ? "<br>" : "\n";
  
  let lines = [];
  
  // Header line
  lines.push(`Pole ${getValue('pole')} Fixture ${getValue('fixture')}`);
  
  // Wire test pairings array configuration
  const testPairs = [
    { label: 'RrBb', ohm: 'ohm_rrbb', volt: 'volt_rrbb' },
    { label: 'RbBr', ohm: 'ohm_rbbr', volt: 'volt_rbbr' },
    { label: 'RrBg', ohm: 'ohm_rrbg', volt: 'volt_rrbg' },
    { label: 'RbBg', ohm: 'ohm_rbbg', volt: 'volt_rbbg' },
    { label: 'RgBr', ohm: 'ohm_rgbr', volt: 'volt_rgbr' },
    { label: 'RgBb', ohm: 'ohm_rgbb', volt: 'volt_rgbb' }
  ];
  
  // Only compile the line if at least one data point was typed for that pair
  testPairs.forEach(pair => {
    const oVal = getValue(pair.ohm);
    const vVal = getValue(pair.volt);
    if (oVal || vVal) {
      lines.push(`${pair.label} = ${oVal} MΩ ${vVal} V`);
    }
  });
  
  // Transformer power input/output tracking line
  const vacVal = getValue('vac');
  const vdcVal = getValue('vdc');
  if (vacVal || vdcVal) {
    lines.push(`Input ${vacVal} VAC, Output ${vdcVal} VDC`);
  }
  
  return lines.join(br);
}

// Update the live HTML preview whenever a user types
document.getElementById('readingForm').addEventListener('input', () => {
  document.getElementById('result').innerHTML = generateSummary(true);
});

// Resets all values and wipes preview clean
function resetForm() {
  if (confirm("Are you sure you want to clear all data?")) {
    document.getElementById('readingForm').reset();
    document.getElementById('result').innerHTML = '';
  }
}

// Upgraded Copy Engine to handle both online and offline iOS environments
function copySummary() {
  const plainText = generateSummary(false);
  const btn = document.getElementById("copyBtn");

  const successAction = () => {
    btn.innerText = "Copied!";
    btn.style.backgroundColor = "#d4edda";
    setTimeout(() => {
      btn.innerText = "Copy Summary";
      btn.style.backgroundColor = "";
    }, 1500);
  };

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(plainText)
      .then(successAction)
      .catch(() => fallbackCopy(plainText, successAction));
  } else {
    fallbackCopy(plainText, successAction);
  }
}

function fallbackCopy(text, callback) {
  const textArea = document.createElement("textarea");
  textArea.value = text;
  textArea.style.position = "fixed";
  textArea.style.left = "-999999px";
  textArea.style.top = "-999999px";
  document.body.appendChild(textArea);
  textArea.focus();
  textArea.select();
  textArea.setSelectionRange(0, 99999);
  
  try {
    document.execCommand('copy');
    callback();
  } catch (err) {
    console.error("Fallback copy failed", err);
  }
  
  document.body.removeChild(textArea);
}
</script>
